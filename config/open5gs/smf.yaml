logger:
  file:
    path: /opt/open5gs/var/log/open5gs/smf.log
  level: info
smf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      nrf:
        - uri: http://10.10.0.10:7777
  pfcp:
    server:
      - dev: eth0
    client:
      upf:
        - address: 10.10.0.22
  gtpc:
    server:
      - dev: eth0
  gtpu:
    server:
      - dev: eth0
  metrics:
    server:
      - dev: eth0
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dnn: ims
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  ctf:
    enabled: auto
